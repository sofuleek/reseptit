<!DOCTYPE html>
<html>

<head>
  <title>Reseptin muokkaus</title>
</head>

<body>
    <h1>Reseptin muokkaus</h1>
  <form action="/update_item" method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" value="{{ item.title }}"/>
    </p>
    <p>
      Reseptin kuvaus: <br />
      <textarea name="description" rows="10" cols="60">{{ item.description }}</textarea>
    </p>
    <p>
      Valmistusaika: <br />
      <input type="text" name="preparation_time" size="8" value="{{ item.preparation_time }}" /> min
    </p>
    <input type="hidden" name="item_id" value="{{ item.id }}" />
    <input type="submit" value="Päivitä reseptia" />
  </form>
</body>

</html>
