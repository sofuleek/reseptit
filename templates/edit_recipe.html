<!DOCTYPE html>
<html>

<head>
  <title>Reseptin muokkaus</title>
</head>

<body>
    <h1>Reseptin muokkaus</h1>
  <form action="/update_recipe" method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" value="{{ recipe.title }}" maxlength="50" required />
    </p>
    <p>
      Reseptin kuvaus: <br />
      <textarea name="description" rows="10" cols="60" maxlength="1000" required >{{ recipe.description }}</textarea>
    </p>
    <p>
      Valmistusaika: <br />
      <input type="text" name="preparation_time" size="8" pattern = "[1-9][0-9]{0,3}" required value="{{ recipe.preparation_time }}" /> min
    </p>
    <input type="hidden" name="recipe_id" value="{{ recipe.id }}" />
    <input type="submit" value="Päivitä reseptia" />
  </form>
</body>

</html>
