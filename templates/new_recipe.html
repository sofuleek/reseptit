<!DOCTYPE html>
<html>

<head>
  <title>Uusi resepti</title>
</head>

<body>
    <h1>Uusi resepti</h1>
  <form action="/create_recipe" method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" maxlength="50" required />
    </p>
    <p>
      Reseptin kuvaus: <br />
      <textarea name="description" rows="10" cols="60" maxlength="1000" required ></textarea>
    </p>
    <p>
      Valmistusaika: <br />
      <input type="text" name="preparation_time" size="8" pattern = "[1-9][0-9]{0,3}" required /> min
    </p>
    <p>
      Ruoan tyyppi: <br />
      <select name="category">
        <option value="">(valitse)</option>
        <option value="aamupala">Aamupala</option>
        <option value="lounas">Lounas</option>
        <option value="päivällinen">Päivällinen</option>
        <option value="välipala">Välipala</option>
        <option value="alkuruoka">Alkuruoka</option>
        <option value="pääruoka">Pääruoka</option>
        <option value="jälkiruoka">Jälkiruoka</option>
        <option value="leivonnainen">Leivonnainen</option>
        <option value="juoma">Juoma</option>
      </select>
    </p>

    <p>
      Ruokavalio: <br />

      <label>
        <input type="checkbox" name="diet[]" value="laktoositon">
        Laktoositon
      </label>
      <br>

      <label>
        <input type="checkbox" name="diet[]" value="gluteeniton">
        Gluteeniton
      </label><br>

      <label>
        <input type="checkbox" name="diet[]" value="maidoton">
        Maidoton
      </label><br>

      <label>
        <input type="checkbox" name="diet[]" value="munaton">
        Munaton
      </label><br>

      <label>
        <input type="checkbox" name="diet[]" value="vegaaninen">
        Vegaaninen
      </label><br>

      <label>
        <input type="checkbox" name="diet[]" value="kasvis">
        Kasvis
      </label>
</p>

<input type="submit" value="Luo resepti">
  </form>
</body>

</html>
